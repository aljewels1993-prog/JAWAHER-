<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>بوصلة · غير متصل</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(140deg,#1a3047,#2f527a);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;color:#1a2b40;text-align:center;padding:24px}
  .card{background:#fff;border-radius:28px;padding:32px 24px;max-width:360px;box-shadow:0 18px 40px rgba(0,0,0,.25)}
  h1{margin:.2em 0;font-size:1.5rem} p{color:#4b5b70;line-height:1.7}
  button{margin-top:12px;border:0;border-radius:999px;padding:12px 24px;font:inherit;font-weight:700;background:#e9b44c;color:#1a3047}
</style>
</head>
<body>
  <div class="card">
    <div style="font-size:56px">🧭</div>
    <h1>أنتِ غير متصلة بالإنترنت</h1>
    <p>تحتاج بوصلة إلى الإنترنت لحفظ تقدمك. تحقّقي من الاتصال ثم حاولي مرة أخرى.</p>
    <p dir="ltr">You are offline. BOUSLA needs a connection to sync your progress.</p>
    <button onclick="location.reload()">حاولي مرة أخرى · Try again</button>
  </div>
</body>
</html>
