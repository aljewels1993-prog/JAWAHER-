# Netlify configuration for OMAN ENGLISH QUEST 3D.
# The game lives in the oman-quest/ folder (Vite + React + Three.js), so
# Netlify must build there and publish its dist/ folder. Without this file
# Netlify publishes the repository root, which has no index.html → 404.

[build]
  base    = "oman-quest"
  command = "npm run build"
  publish = "dist"            # relative to base → oman-quest/dist

[build.environment]
  NODE_VERSION = "22"

# Single-page app: any unknown path opens the game. Real files (assets,
# sw.js, manifest, icons) are served first because this rule is not forced.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# The service worker and the page must always be re-checked so students get updates.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

# Built files have content hashes in their names, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
